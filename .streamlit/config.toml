[theme]
# Primary accent color: The signature "CKB Green" 
primaryColor = #c91a2b

# Background color: Deep black/dark grey as seen on the site
backgroundColor = "#0B0E0F"

# Secondary background color: Slightly lighter grey for sidebars/cards
secondaryBackgroundColor = "#191B1F"

# Main text color: High contrast white/off-white
textColor = "#FFFFFF"

# Font family: Clean, athletic sans-serif
font = "sans serif"